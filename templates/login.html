{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — DONO Admin</title>
  <link rel="stylesheet" href="{% static 'css/dono.css' %}">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;">
        <div class="brand-badge" style="width:46px;height:46px;font-size:20px;">D</div>
        <div>
          <h1 style="margin:0;font-size:22px;font-weight:700;">DONO Admin</h1>
          <div class="muted-text">Test va O‘quvchilar Platformasi</div>
        </div>
      </div>

      <div class="login-info">
        <div style="font-weight:700;color:#1d4ed8;margin-bottom:4px;">O‘z bazangiz bilan ishlaydi (Django + SQLite)</div>
        <div>Hech qanday tashqi API kaliti yoki token talab qilinmaydi. Standart login: <span class="mono" style="font-weight:700;">admin</span> / <span class="mono" style="font-weight:700;">admin123</span></div>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="fillDefaultCreds()">
          Standart loginni to‘ldirish
        </button>
      </div>

      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="id_username">Login</label>
          <input id="id_username" name="username" type="text" class="input" value="{{ username_val }}" placeholder="admin" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="id_password">Parol</label>
          <input id="id_password" name="password" type="password" class="input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:11px 16px;margin-top:6px;">
          Kirish
        </button>
      </form>
    </div>
  </div>

  <script>
    function fillDefaultCreds() {
      document.getElementById('id_username').value = 'admin';
      document.getElementById('id_password').value = 'admin123';
    }
  </script>
</body>
</html>
